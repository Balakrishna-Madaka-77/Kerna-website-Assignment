<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Kerna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="Assignment.css">
</head>

<body class="bg-neutral-50 dark:bg-neutral-900 text-neutral-800 dark:text-neutral-200">

<section class="max-w-3xl mx-auto py-20 px-6">
  <h1 class="text-3xl font-bold mb-6">Contact Us</h1>

  <form class="space-y-6">
    <input type="text" placeholder="Your Name" class="w-full p-3 border rounded">
    <input type="email" placeholder="Your Email" class="w-full p-3 border rounded">
    <textarea placeholder="Your Message" class="w-full p-3 border rounded"></textarea>
    <button class="bg-teal-500 text-white px-6 py-3 rounded">
      Send Message
    </button>
  </form>

</section>

<script src="theme.js"></script>
</body>
</html>
